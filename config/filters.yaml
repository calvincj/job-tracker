# Tune these freely. A job must match keywords_any AND (locations_any OR remote
# OR unknown location), and must NOT contain an exclude_title term (whole-word).

# Note: the digest/dashboard show every currently-open match, full stop - no
# rolling time window. "New today" (dashboard) is its own thing: genuinely new
# to the tracker, or the source's own posted date is today.

# Title must contain at least one of these (case-insensitive substring).
# Bare "analyst" and "data" are NOT here - they're generic enough to match any
# domain (bioinformatics, HR, healthcare data) with zero sector signal, and
# were the main source of off-target noise. The scoped phrases below ("data
# analyst", "data analytics", etc.) are narrow enough to keep, since a title
# has to actually say the compound phrase, not just contain "data" alone.
keywords_any:
  - energy
  - clean
  - climate
  - renewable
  - grid
  - power
  - solar
  - wind
  - battery
  - storage
  - sustainab       # sustainable, sustainability
  - decarbon
  - transition
  - policy
  - regulat
  - supply chain
  - procurement
  - econom          # economist, economics
  - strategy
  - consultant
  - research
  - infrastructure
  - utility
  - carbon
  - critical mineral
  - rare earth
  - lithium
  - battery materials
  - mining
  - magnet
  - mineral
  - data analyst       # scoped, not bare "data" - see note above
  - data analytics
  - market intelligence
  - trade              # trade policy, trade compliance, international trade
  - logistics
  - esg                # ESG analyst / ESG data roles at climate-data shops

# Only gates internships (role_type "intern") - during the school year you're
# at UCSD and can't relocate, so intern postings must be San Diego, SF/Bay
# Area, or remote. New-grad/full-time and everything else are NOT
# location-gated at all - you're willing to relocate anywhere for those.
# See filtering.py passes().
locations_any:
  - remote
  - san diego
  - san francisco
  - bay area
  - south san francisco   # a real neighboring city, not "SF proper", but the
                           # cleantech/biotech corridor is thick with it
  - new york               # also want SF/NYC for internships, not just
  - new york city           # school-year-workable San Diego/remote
  - nyc
  - brooklyn

# Drop senior / leadership roles you can't apply to as an undergrad.
exclude_title:
  - senior
  - sr.
  - sr             # "Sr Network Services Engineer" etc - no period, "sr." alone missed these
  - staff
  - principal
  - director
  - vp
  - vice president
  - head of
  - chief
  - lead
  - manager
  - phd
  - postdoc              # requires an already-completed PhD
  - postdoctoral
  - doctoral
  - expert              # "X Expert" titles are consistently senior/specialist
  - managing consultant # a specific rung above plain "Consultant" at firms
                         # like Guidehouse/Deloitte, not an entry title
  # "ii" / "iii" removed: utility career ladders (Duke, etc.) use Analyst
  # I/II/III and Engineer I/II/III as their normal entry-to-mid grades, so
  # excluding "ii"/"iii" silently hid near-entry roles. Recall > noise here.

  # Not your field - healthcare/clinical consulting practice roles (Guidehouse
  # etc. run large healthcare practices that otherwise pass on "consultant").
  - healthcare
  - health care
  - clinical
  - patient
  - medical
  - hospital
  - physician
  - nursing
  - pharma
  - oncology
  - epidemiology
  - epidemiologist
  - bioinformatics
  - biomedical
  - dental
  - veterinary
  - revenue cycle
  - public health

  # Not your field - "econom" (economist/economics) and "research" are broad
  # on purpose to catch energy/climate econ roles, but that same breadth lets
  # in agricultural/farm economics, which isn't what you're after.
  - agricultural
  - agriculture
  - farm

  # Not your field - sales roles slip through because "energy"/"solar"/
  # "renewable" etc show up in their titles too (e.g. "Solar Sales
  # Representative", "Energy Sales Retail Associate"). Whole-word match, so
  # "sales" doesn't touch "Salesforce" (Guidehouse/Baker Tilly Salesforce
  # Consultant roles stay in).
  - sales
  - account executive

  # Not your field - marketing roles (e.g. "Marketing and Communications Data
  # Analyst" slips through on "data analyst"), and hands-on field/trade roles
  # you're not credentialed for (electrician licensure, technician trade
  # skills), e.g. "Solar Licensed Electrician", "Wind Technician".
  - marketing
  - technician
  - electrician

# Best-effort: drop a job if its own description states a minimum years of
# experience above this. Only checked for sources that give us the full
# description for free (Greenhouse, Ashby) - others are left unfiltered on
# this dimension since we have nothing to check (recall > false confidence).
max_years_experience: 3

# Absolute age cutoff, using the source's own "posted" date - a listing this
# old is almost certainly a zombie req still marked open, not a real live
# opening (e.g. a Brookings RA posting that sat at 700+ days). Unparseable/
# unknown posted dates are NOT dropped by this (can't verify = kept, same
# recall-first stance as everything else here).
max_days_since_posted: 100

# Your actual grad year - June 2027. Only used to drop postings that
# EXPLICITLY name a different class year in the title or description (e.g.
# "Summer 2027 Internship - Class of 2028", "New Grad 2026 Program"). A
# posting that names no class year at all is NOT touched by this - most
# postings don't say one, and dropping those on a guess would hurt recall.
# This exists specifically to keep "Class of 2028" internships (the standard
# label for a rising-senior summer-2027 internship, which isn't you) out of
# the intern track, and to keep stale/premature "2026" or "2028" new-grad
# programs out of the new-grad track. See filtering.py _class_year_conflict.
target_grad_year: 2027

# US-only. Full country names are matched anywhere in the location text
# (whole word); short country codes are only matched as the exact LAST
# comma-separated segment (e.g. "Edinburgh, GB") - a bare substring scan on
# 2-letter codes is too easy to false-positive. Applies even to remote
# postings - an explicit "Remote - Canada" still isn't a US role. Codes that
# collide with a US state postal abbreviation (DE/Delaware, IL/Illinois,
# MA/Massachusetts, ID/Idaho, AR/Arkansas, CO/Colorado) are deliberately left
# out of the code list below - rely on the full country name for those.
non_us_country_names:
  - canada
  - united kingdom
  - mexico
  - brazil
  - argentina
  - chile
  - colombia
  - peru
  - india
  - ind          # ISO alpha-3 for India - some Workday listings format
                 # location as "IND KA Bangalore - Cherry Hills" with no
                 # "India" spelled out and no comma, so the country-code
                 # (last-comma-segment) check below never sees it. Safe as a
                 # whole word - no US city/state is literally "ind".
  # Indian cities, whole-word matched, to catch location strings that use a
  # city name with the ambiguous 2-letter "IN" code (which collides with
  # Indiana's postal code, so "in" is deliberately NOT in the codes list
  # below) instead of spelling out "India", e.g. "IN - Gurugram",
  # "Gurugram, IN", "IN   Trivandrum".
  - bangalore
  - bengaluru
  - hyderabad
  - gurgaon
  - gurugram
  - chennai
  - noida
  - trivandrum
  - kolkata
  - pune
  - mumbai
  - ahmedabad
  - china
  - japan
  - south korea
  - korea
  - singapore
  - malaysia
  - indonesia
  - philippines
  - vietnam
  - thailand
  - australia
  - new zealand
  - germany
  - france
  - spain
  - italy
  - netherlands
  - belgium
  - switzerland
  - austria
  - sweden
  - norway
  - denmark
  - finland
  - poland
  - ireland
  - portugal
  - greece
  - czech republic
  - hungary
  - romania
  - ukraine
  - russia
  - turkey
  - israel
  - saudi arabia
  - united arab emirates
  - uae
  - qatar
  - south africa
  - nigeria
  - kenya
  - egypt
  - morocco
  - hong kong
  - taiwan
  - pakistan
  - bangladesh
  - gyeonggi-do        # Korean province - seen without a country code/name attached

non_us_country_codes:
  - gb
  - uk
